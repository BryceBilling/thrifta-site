<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thrifta</title>
</head>

<body>
  <div id="root"></div>

  <!--
    Hidden static form so Netlify's build bot can detect and register this
    form. Field names must match the ones posted from the React DSAR form.
  -->
  <form name="dsar-request" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="text" name="website" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="submittingAs" />
    <input type="text" name="lawfulBasis" />
    <textarea name="details"></textarea>
    <input type="text" name="bot-field" />
  </form>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
